<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SimGrid</title>
  <style>
    body {
      background: #111;
      color: #eee;
      font-family: monospace;
      text-align: center;
      margin: 0;
      padding: 0;
    }
    #grid {
      display: grid;
      grid-template-columns: repeat(8, 40px);
      gap: 2px;
      justify-content: center;
      margin-top: 20px;
    }
    .cell {
      width: 40px; height: 40px;
      background: #333;
      border: 1px solid #222;
      cursor: pointer;
      font-size: 0.8rem;
    }
    .R { background: green; }
    .C { background: blue; }
    .I { background: orange; }
    .P { background: red; }
    .W { background: cyan; }
  </style>
</head>
<body>
  <h1>SimGrid</h1>
  <div>💰 Money: $<span id="money">1000</span></div>
  <div>
    <button onclick="setBuild('R')">Residence ($100)</button>
    <button onclick="setBuild('C')">Commercial ($120)</button>
    <button onclick="setBuild('I')">Industry ($80)</button>
    <button onclick="setBuild('P')">Power Plant ($200)</button>
    <button onclick="setBuild('W')">Water Pump ($150)</button>
  </div>
  <div id="grid"></div>

  <script>
    const grid = document.getElementById('grid');
    const moneyDisplay = document.getElementById('money');
    const width = 8, height = 8;
    const cost = { R: 100, C: 120, I: 80, P: 200, W: 150 };
    const income = { R: 10, C: 20 };
    let cells = Array(width * height).fill(null);
    let money = 1000;
    let currentBuild = null;

    function setBuild(type) {
      currentBuild = type;
    }

    function updateMoneyDisplay() {
      moneyDisplay.textContent = money;
    }

    function getNeighbors(i) {
      const x = i % width, y = Math.floor(i / width);
      const deltas = [-1, 1, -width, width];
      return deltas.map(d => i + d).filter(n => n >= 0 && n < width * height);
    }

    function place(i) {
      if (!currentBuild || cells[i] || money < cost[currentBuild]) return;
      money -= cost[currentBuild];
      cells[i] = { type: currentBuild, level: 1 };
      render();
      updateMoneyDisplay();
    }

    function render() {
      grid.innerHTML = '';
      for (let i = 0; i < cells.length; i++) {
        const cell = document.createElement('div');
        cell.className = 'cell';
        if (cells[i]) cell.classList.add(cells[i].type);
        if (cells[i]) cell.textContent = cells[i].type + (cells[i].level || '');
        cell.onclick = () => place(i);
        grid.appendChild(cell);
      }
    }

    function checkInfluence() {
      for (let i = 0; i < cells.length; i++) {
        const b = cells[i];
        if (!b || !['R', 'C'].includes(b.type)) continue;
        const neighbors = getNeighbors(i);
        let influence = 0;
        for (let n of neighbors) {
          const nb = cells[n];
          if (!nb) continue;
          if (['W', 'C', 'R'].includes(nb.type)) influence++;
          if (['P', 'I'].includes(nb.type)) influence--;
        }
        b.level = Math.max(1, Math.min(4, influence));
      }
      render();
    }

    function collectIncome() {
      for (let i = 0; i < cells.length; i++) {
        const b = cells[i];
        if (!b || !income[b.type]) continue;
        money += income[b.type] * b.level;
      }
      updateMoneyDisplay();
    }

    setInterval(() => {
      checkInfluence();
      collectIncome();
    }, 6000);

    render();
    updateMoneyDisplay();
  </script>
</body>
</html>
